name: Verify and deploy to GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Use Ubuntu archives over HTTPS
        run: |
          sudo python3 - <<'PY'
          from pathlib import Path
          import re
          paths = [Path('/etc/apt/sources.list'),
                   *Path('/etc/apt/sources.list.d').glob('*.list'),
                   *Path('/etc/apt/sources.list.d').glob('*.sources'),
                   *Path('/etc/apt').glob('apt-mirrors*.txt')]
          for path in paths:
              if path.exists():
                  source = path.read_text()
                  source = re.sub(r'https?://(?:[^/\s]+\.)?archive\.ubuntu\.com/ubuntu', 'https://archive.ubuntu.com/ubuntu', source)
                  source = source.replace('http://security.ubuntu.com/ubuntu', 'https://security.ubuntu.com/ubuntu')
                  path.write_text(source)
                  print(f'Normalized Ubuntu mirrors in {path}')
          PY
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e
      - run: pnpm build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
